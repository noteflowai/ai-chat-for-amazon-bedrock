name: Quality gate

# Everything a release must pass, on every push and pull request. The same script runs
# locally, so a green run here means the same thing a developer sees.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Release gate on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest version the plugin header claims, a common one, and the newest, whose
        # deprecations show what the next version will remove.
        php: ['7.4', '8.3', '8.5']

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # phpcs needs these; a minimal build does not have them.
          extensions: tokenizer, xmlwriter, simplexml, mbstring
          coverage: none
          tools: none

      - name: Cache the pinned linters
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-${{ hashFiles('bin/setup-tools.sh') }}

      - name: Install the pinned linters
        run: bin/setup-tools.sh

      - name: Run the gate
        run: bin/prerelease.sh --php "$(which php)"

      # The provider against the AI Client library itself, which the gate's suites stand in
      # for. 1.4.0 is the first release with embeddings and 1.5.0 the current one; the copy
      # bundled with WordPress is covered in the plugin-check job.
      - name: Test the AI Client provider against php-ai-client
        run: |
          for tag in 1.4.0 1.5.0; do
            git clone --quiet --depth 1 --branch "$tag" https://github.com/WordPress/php-ai-client "/tmp/php-ai-client-$tag" 2>/dev/null
            AICFAB_AI_CLIENT="/tmp/php-ai-client-$tag" php tests/core-ai-library.php
          done

      # The gate skips this suite while running, because it drives the gate itself.
      - name: Test the release tooling
        run: php tests/tooling.php

      - name: Build the package
        run: |
          bin/build-package.py
          bin/build-package.py --verify "dist/ai-chat-for-amazon-bedrock.$(grep -m1 -oP '^\s*\*\s*Version:\s*\K[0-9.]+' ai-chat-for-amazon-bedrock.php).zip"

      - name: Keep the package for inspection
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@v4
        with:
          name: plugin-package
          path: dist/*.zip
          retention-days: 14

  plugin-check:
    name: Official Plugin Check
    runs-on: ubuntu-latest
    # A real WordPress install is needed, so this runs separately from the gate matrix.
    services:
      mysql:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: wordpress
          MARIADB_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, tokenizer, xmlwriter, simplexml, mbstring
          coverage: none

      - name: Install WP-CLI
        run: |
          # setup-php's wp-cli tool started failing to resolve a download on this runner, so the
          # release is pinned and checked against the checksum published with it.
          WP_CLI_VERSION=2.12.0
          base="https://github.com/wp-cli/wp-cli/releases/download/v${WP_CLI_VERSION}"
          curl -sSfL -o /tmp/wp-cli.phar "$base/wp-cli-${WP_CLI_VERSION}.phar"
          echo "$(curl -sSfL "$base/wp-cli-${WP_CLI_VERSION}.phar.sha512")  /tmp/wp-cli.phar" | sha512sum -c -
          sudo install -m 0755 /tmp/wp-cli.phar /usr/local/bin/wp
          wp --version

      - name: Install WordPress
        run: |
          # wp core download drops files. On this runner it produced a WordPress whose bundled
          # AI client library was missing 19 of its 101 source files, deterministically, so
          # taking the download again changed nothing. Every one of those files is present and
          # normally compressed in the official archive, with unremarkable paths. Its extractor
          # is also memory hungry enough to die outright under a 128 MB limit. So the archive is
          # fetched and unpacked directly, and then checked rather than trusted.
          WP_VERSION="$(curl -sS https://api.wordpress.org/core/version-check/1.7/ \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["offers"][0]["current"])')"
          echo "installing WordPress $WP_VERSION"
          curl -sS -o /tmp/wp.zip "https://wordpress.org/wordpress-${WP_VERSION}.zip"
          unzip -q /tmp/wp.zip -d /tmp/unpacked
          mv /tmp/unpacked/wordpress /tmp/wp
          rm -rf /tmp/wp.zip /tmp/unpacked
          wp config create --path=/tmp/wp --dbname=wordpress --dbuser=root \
            --dbpass=wordpress --dbhost=127.0.0.1:3306
          wp core install --path=/tmp/wp --url=http://localhost --title="Gate" \
            --admin_user=admin --admin_password="$(openssl rand -hex 16)" \
            --admin_email=gate@example.invalid --skip-email
          # The gate reports that it verified the plugin against a real WordPress. That claim is
          # only worth something if the WordPress is intact, and once it was not.
          wp core verify-checksums --path=/tmp/wp

      - name: Install this plugin into it
        run: |
          mkdir -p /tmp/wp/wp-content/plugins/ai-chat-for-amazon-bedrock
          rsync -a --exclude=.git --exclude=.tools --exclude=dist \
            ./ /tmp/wp/wp-content/plugins/ai-chat-for-amazon-bedrock/

      - name: Run the official Plugin Check
        run: |
          bin/setup-tools.sh
          # The provider suite also runs against the AI Client this WordPress bundles.
          AICFAB_AI_CLIENT=/tmp/wp/wp-includes/php-ai-client \
            bin/prerelease.sh --php "$(which php)" \
            --wp-cli "wp --path=/tmp/wp --allow-root"
